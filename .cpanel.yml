deployment:
  tasks:
    - export DEPLOYPATH=/home/tanzatrade/tanzaniatradecore.co.tz/
    - /bin/cp -R cpanel_extracted/cpanel $DEPLOYPATH
    - /bin/cp cpanel_extracted/index.html $DEPLOYPATH
