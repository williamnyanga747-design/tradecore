<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — GlobalTradeCore</title>
    <meta name="theme-color" content="#0f766e" />
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7f9; color: #1f2937; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .card { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.08); padding: 40px 32px; max-width: 360px; text-align: center; }
      .logo { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #0f766e, #047857); color: #fff; font-size: 28px; font-weight: 900; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: #6b7280; margin: 0 0 24px; }
      button { background: #0f766e; color: #fff; border: none; border-radius: 10px; padding: 12px 24px; font-size: 14px; font-weight: 700; cursor: pointer; }
      button:hover { background: #115e59; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">TC</div>
      <h1>You are offline</h1>
      <p>Please check your internet connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
